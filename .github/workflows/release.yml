name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: pocketrag-x86_64-linux.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: pocketrag-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: pocketrag-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The model is committed via Git LFS or fetched once and cached; either
      # way it must exist under assets/ before `cargo build`.
      - name: Pull model assets (Git LFS)
        run: git lfs pull || true

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} pocketrag
          cd ../../..
          sha256sum ${{ matrix.archive }} >> checksums.txt

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/pocketrag.exe `
            -DestinationPath ${{ matrix.archive }}
          $h = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash
          Add-Content checksums.txt "$($h.ToLower())  ${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            checksums.txt

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            checksums.txt
